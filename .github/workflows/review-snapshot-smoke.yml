name: Review snapshot focused smoke

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'tools/**'
      - '.github/workflows/review-snapshot-smoke.yml'

permissions:
  contents: read

jobs:
  dns-and-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check production workspace
        run: cargo check --workspace --locked
      - name: Test DNS implementation
        run: cargo test --lib --locked server::dns::tests -- --test-threads=1
      - name: Test repository path policy
        run: cargo test --manifest-path tools/Cargo.toml -p rr-dev --locked repo::policy
