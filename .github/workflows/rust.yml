name: Rust проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Загрузить исходники
        uses: actions/checkout@v4
      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Установить musl linker
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Получить закреплённую зависимость REALITY
        run: |
          git clone https://github.com/ssrlive/reality-rs.git reality-rs
          git -C reality-rs checkout --detach e71b6c20b0860d9fa9589862e81fa8869ed4fa7a
          git -C reality-rs apply --recount --ignore-space-change --ignore-whitespace --check ../prototype/reality-xray.patch
          git -C reality-rs apply --recount --ignore-space-change --ignore-whitespace ../prototype/reality-xray.patch
      - name: Проверить форматирование
        working-directory: prototype
        run: cargo fmt --all -- --check
      - name: Собрать и выполнить Rust-тесты
        working-directory: prototype
        run: cargo test --locked --release
      - name: Собрать статический пилотный бинарник
        working-directory: prototype
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Проверить статическую линковку
        run: |
          binary=prototype/target/x86_64-unknown-linux-musl/release/nightvpn-xray-rust-prototype
          test -x "$binary"
          ! readelf -l "$binary" | grep -F 'Requesting program interpreter'
          ! readelf -d "$binary" | grep -F '(NEEDED)'
      - name: Сохранить статический пилотный бинарник
        uses: actions/upload-artifact@v4
        with:
          name: remnanode-prototype-musl-${{ github.event.pull_request.head.sha || github.sha }}
          path: prototype/target/x86_64-unknown-linux-musl/release/nightvpn-xray-rust-prototype
          if-no-files-found: error
          retention-days: 7
      - name: Проверить синтаксис Python-тестов
        run: python3 -m py_compile install.py prototype/test_interop.py prototype/test_node_client.py prototype/test_remnawave.py
      - name: Проверить установщик без работающей ноды
        run: python3 -m unittest discover -s tests -v
