[package]
name = "nightvpn-xray-rust-prototype"
version = "26.11.9"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
h2 = "0.4"
hickory-proto = { version = "0.26.2", default-features = false, features = ["std"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
md5 = "0.8"
prost = "0.14"
regex = "1"
rustls = { path = "../reality-rs/rustls" }
rustls-aws-lc-rs = { path = "../reality-rs/rustls-aws-lc-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "process", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
